<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bishal Party Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .app-bg {
      background: linear-gradient(180deg, #1b003a 0%, #000000 30%);
    }

    /* VIP Cards */
    .vip-card {
      background: linear-gradient(135deg, #3b1477 0%, #1e0947 100%);
      border: 1.5px solid #8b5cf6;
      box-shadow: inset 0 0 12px rgba(139, 92, 246, 0.4);
    }
    .svip-card {
      background: linear-gradient(135deg, #78350f 0%, #3e1b00 100%);
      border: 1.5px solid #eab308;
      box-shadow: inset 0 0 12px rgba(234, 179, 8, 0.4);
    }

    /* Assets Buttons */
    .asset-wallet { background: linear-gradient(135deg, #6b21a8 0%, #4c1d95 100%); }
    .asset-store { background: linear-gradient(135deg, #86198f 0%, #701a75 100%); }
    .asset-bag { background: linear-gradient(135deg, #0f766e 0%, #115e59 100%); }

    /* List Item Border */
    .menu-item {
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* Curved Bottom Navigation */
    .curved-nav {
      background: rgba(22, 10, 42, 0.95);
      border: 1.5px solid rgba(139, 92, 246, 0.4);
      border-radius: 30px;
      backdrop-filter: blur(12px);
    }
    
    /* Icon Badges */
    .icon-box {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen">

  <div class="w-full max-w-md h-screen app-bg flex flex-col justify-between overflow-hidden relative">

    <!-- Scrollable Main Content -->
    <div class="flex-1 overflow-y-auto px-4 pt-4 pb-24 space-y-4">
      
      <!-- User Profile Header -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250" class="w-14 h-14 rounded-full object-cover border-2 border-purple-500 shadow-md">
          <div>
            <h2 class="text-base font-bold flex items-center gap-1">দাদা ভাই™</h2>
            <div class="flex items-center gap-1.5 text-xs text-purple-200 mt-0.5">
              <i class="fa-solid fa-address-card text-[11px]"></i>
              <span>101223</span>
              <i class="fa-regular fa-copy text-[10px] cursor-pointer ml-1" onclick="copyID('101223')"></i>
            </div>
          </div>
        </div>
        <button class="text-lg text-purple-300 p-2 active:scale-95 transition" onclick="openPage('edit_profile.html')">
          <i class="fa-regular fa-pen-to-square"></i>
        </button>
      </div>

      <!-- User Counters -->
      <div class="grid grid-cols-3 text-center py-1">
        <div class="cursor-pointer" onclick="openPage('visitors.html')">
          <div class="text-base font-extrabold">3</div>
          <div class="text-[11px] text-gray-400">Visitors</div>
        </div>
        <div class="cursor-pointer" onclick="openPage('following.html')">
          <div class="text-base font-extrabold">2</div>
          <div class="text-[11px] text-gray-400">Following</div>
        </div>
        <div class="cursor-pointer" onclick="openPage('followers.html')">
          <div class="text-base font-extrabold">2</div>
          <div class="text-[11px] text-gray-400">Followers</div>
        </div>
      </div>

      <!-- VIP / SVIP Banners -->
      <div class="grid grid-cols-2 gap-3">
        <div class="vip-card h-20 rounded-2xl flex items-center justify-between px-4 cursor-pointer active:scale-95 transition" onclick="openPage('vip.html')">
          <span class="text-2xl font-black italic tracking-wider text-white">VIP</span>
          <div class="w-10 h-10 rounded-full bg-purple-500/30 border border-purple-400 flex items-center justify-center">
            <i class="fa-solid fa-crown text-amber-300 text-lg"></i>
          </div>
        </div>

        <div class="svip-card h-20 rounded-2xl flex items-center justify-between px-4 cursor-pointer active:scale-95 transition" onclick="openPage('svip.html')">
          <span class="text-2xl font-black italic tracking-wider text-yellow-300">SVIP</span>
          <div class="w-10 h-10 rounded-full bg-yellow-500/30 border border-yellow-400 flex items-center justify-center">
            <i class="fa-solid fa-crown text-yellow-400 text-lg"></i>
          </div>
        </div>
      </div>

      <!-- Assets Section -->
      <div>
        <h3 class="text-xs font-bold text-gray-300 mb-2">My Assets</h3>
        <div class="grid grid-cols-3 gap-2.5">
          <div class="asset-wallet py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition" onclick="openPage('wallet.html')">
            <i class="fa-solid fa-wallet text-purple-200 text-sm"></i>
            <span class="text-xs font-bold">Wallet</span>
          </div>
          <div class="asset-store py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition" onclick="openPage('store.html')">
            <i class="fa-solid fa-store text-pink-200 text-sm"></i>
            <span class="text-xs font-bold">Store</span>
          </div>
          <div class="asset-bag py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition" onclick="openPage('bag.html')">
            <i class="fa-solid fa-bag-shopping text-emerald-200 text-sm"></i>
            <span class="text-xs font-bold">Bag</span>
          </div>
        </div>
      </div>

      <!-- Menu List Items -->
      <div class="flex flex-col">
        
        <div class="menu-item py-3 flex justify-between items-center cursor-pointer active:bg-white/5 px-1 rounded-lg transition" onclick="openPage('medal.html')">
          <div class="flex items-center gap-3">
            <div class="icon-box bg-purple-900/60 text-purple-300">
              <i class="fa-solid fa-medal text-sm"></i>
            </div>
            <span class="text-xs font-semibold">Medal</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
        </div>

        <div class="menu-item py-3 flex justify-between items-center cursor-pointer active:bg-white/5 px-1 rounded-lg transition" onclick="openPage('family.html')">
          <div class="flex items-center gap-3">
            <div class="icon-box bg-pink-900/60 text-pink-300">
              <i class="fa-solid fa-house text-sm"></i>
            </div>
            <span class="text-xs font-semibold">Family</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
        </div>

        <div class="menu-item py-3 flex justify-between items-center cursor-pointer active:bg-white/5 px-1 rounded-lg transition" onclick="openPage('cp.html')">
          <div class="flex items-center gap-3">
            <div class="icon-box bg-indigo-900/60 text-indigo-300">
              <i class="fa-solid fa-heart text-sm"></i>
            </div>
            <span class="text-xs font-semibold">CP</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
        </div>

        <div class="menu-item py-3 flex justify-between items-center cursor-pointer active:bg-white/5 px-1 rounded-lg transition" onclick="openPage('level.html')">
          <div class="flex items-center gap-3">
            <div class="icon-box bg-blue-900/60 text-blue-300">
              <i class="fa-solid fa-chart-line text-sm"></i>
            </div>
            <span class="text-xs font-semibold">Level</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
        </div>

        <div class="menu-item py-3 flex justify-between items-center cursor-pointer active:bg-white/5 px-1 rounded-lg transition" onclick="openPage('contact.html')">
          <div class="flex items-center gap-3">
            <div class="icon-box bg-teal-900/60 text-teal-300">
              <i class="fa-solid fa-headset text-sm"></i>
            </div>
            <span class="text-xs font-semibold">Contact us</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
        </div>

        <div class="menu-item py-3 flex justify-between items-center cursor-pointer active:bg-white/5 px-1 rounded-lg transition" onclick="openPage('relatives.html')">
          <div class="flex items-center gap-3">
            <div class="icon-box bg-fuchsia-900/60 text-fuchsia-300">
              <i class="fa-solid fa-users text-sm"></i>
            </div>
            <span class="text-xs font-semibold">Brother and Sister</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
        </div>

        <div class="menu-item py-3 flex justify-between items-center cursor-pointer active:bg-white/5 px-1 rounded-lg transition" onclick="openPage('host_center.html')">
          <div class="flex items-center gap-3">
            <div class="icon-box bg-amber-900/60 text-amber-300">
              <i class="fa-solid fa-crown text-sm"></i>
            </div>
            <span class="text-xs font-semibold">Host Center</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
        </div>

        <div class="menu-item py-3 flex justify-between items-center cursor-pointer active:bg-white/5 px-1 rounded-lg transition" onclick="openPage('setting.html')">
          <div class="flex items-center gap-3">
            <div class="icon-box bg-gray-800 text-gray-300">
              <i class="fa-solid fa-gear text-sm"></i>
            </div>
            <span class="text-xs font-semibold">Setting</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
        </div>

      </div>

    </div>

    <!-- Fixed Bottom Navigation Bar (Pointer-events fixed) -->
    <div class="px-3 pb-3 absolute bottom-0 left-0 right-0 z-30 pointer-events-none">
      <div class="curved-nav py-2.5 px-4 grid grid-cols-4 text-center pointer-events-auto">
        
        <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-purple-300 active:scale-95 transition" onclick="openPage('home.html')">
          <i class="fa-solid fa-house text-base"></i>
          <span class="text-[10px] font-semibold mt-0.5">Home</span>
        </div>

        <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-purple-300 active:scale-95 transition" onclick="openPage('moment.html')">
          <i class="fa-solid fa-camera text-base"></i>
          <span class="text-[10px] font-semibold mt-0.5">Moment</span>
        </div>

        <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-purple-300 active:scale-95 transition relative" onclick="openPage('message.html')">
          <i class="fa-solid fa-comment-dots text-base"></i>
          <span class="absolute top-0 right-5 w-2 h-2 bg-pink-500 rounded-full"></span>
          <span class="text-[10px] font-semibold mt-0.5">Message</span>
        </div>

        <div class="flex flex-col items-center cursor-pointer text-purple-400 font-bold active:scale-95 transition" onclick="openPage('me.html')">
          <i class="fa-solid fa-user text-base"></i>
          <span class="text-[10px] mt-0.5">ME</span>
        </div>

      </div>
    </div>

  </div>

  <!-- JavaScript Handler -->
  <script>
    function openPage(pageUrl) {
      console.log("Navigating to: " + pageUrl);
      // Telegram Mini App বা সাধারণ ব্রাউজার পেজ নেভিগেশন:
      // window.location.href = pageUrl;
      alert("Clicked: " + pageUrl);
    }

    function copyID(idText) {
      navigator.clipboard.writeText(idText);
      alert("ID Copied: " + idText);
    }
  </script>

</body>
</html>
