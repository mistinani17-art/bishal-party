<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bishal Party Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .app-bg {
      background: linear-gradient(180deg, #1b003a 0%, #000000 35%);
    }

    /* VIP Cards */
    .vip-card {
      background: linear-gradient(135deg, #4c1d95 0%, #2e1065 100%);
      border: 1px solid #a855f7;
      box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.4);
    }
    .svip-card {
      background: linear-gradient(135deg, #78350f 0%, #451a03 100%);
      border: 1px solid #eab308;
      box-shadow: inset 0 0 10px rgba(234, 179, 8, 0.4);
    }

    /* Assets Buttons */
    .asset-wallet { background: linear-gradient(135deg, #7e22ce 0%, #581c87 100%); }
    .asset-store { background: linear-gradient(135deg, #a21caf 0%, #701a75 100%); }
    .asset-bag { background: linear-gradient(135deg, #0f766e 0%, #115e59 100%); }

    /* List Divider */
    .menu-item {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Floating Curved Bottom Bar */
    .curved-nav {
      background: rgba(27, 10, 50, 0.95);
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      border-radius: 35px;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

  <div class="w-full max-w-md h-screen sm:h-[850px] app-bg flex flex-col justify-between overflow-hidden relative sm:rounded-3xl shadow-2xl">

    <!-- Scrollable Main Content -->
    <div class="flex-1 overflow-y-auto px-4 pt-6 pb-28 space-y-4">
      
      <!-- User Profile Header -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="relative">
            <img id="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250" class="w-16 h-16 rounded-full object-cover border-2 border-purple-500 shadow-lg">
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-lg font-bold">দাদা ভাই™</h2>
            </div>
            <div class="flex items-center gap-1.5 text-xs text-purple-200 mt-1">
              <i class="fa-solid fa-id-card"></i>
              <span>101223</span>
              <i class="fa-regular fa-copy cursor-pointer text-[10px] ml-1"></i>
            </div>
          </div>
        </div>
        <button class="text-xl text-purple-300 p-2"><i class="fa-regular fa-pen-to-square"></i></button>
      </div>

      <!-- User Counters -->
      <div class="grid grid-cols-3 text-center py-2">
        <div>
          <div class="text-base font-extrabold">3</div>
          <div class="text-xs text-gray-400">Visitors</div>
        </div>
        <div>
          <div class="text-base font-extrabold">2</div>
          <div class="text-xs text-gray-400">Following</div>
        </div>
        <div>
          <div class="text-base font-extrabold">2</div>
          <div class="text-xs text-gray-400">Followers</div>
        </div>
      </div>

      <!-- VIP / SVIP Banner Section -->
      <div class="grid grid-cols-2 gap-3">
        <div class="vip-card h-20 rounded-2xl flex items-center justify-between px-4 relative overflow-hidden cursor-pointer">
          <div class="z-10">
            <span class="text-2xl font-black italic tracking-wider text-white">VIP</span>
          </div>
          <div class="w-12 h-12 rounded-full bg-purple-500/20 flex items-center justify-center border border-purple-400">
            <i class="fa-solid fa-crown text-yellow-300 text-xl"></i>
          </div>
        </div>

        <div class="svip-card h-20 rounded-2xl flex items-center justify-between px-4 relative overflow-hidden cursor-pointer">
          <div class="z-10">
            <span class="text-2xl font-black italic tracking-wider text-yellow-300">SVIP</span>
          </div>
          <div class="w-12 h-12 rounded-full bg-yellow-500/20 flex items-center justify-center border border-yellow-400">
            <i class="fa-solid fa-crown text-yellow-400 text-xl"></i>
          </div>
        </div>
      </div>

      <!-- Assets Section -->
      <div class="pt-1">
        <h3 class="text-sm font-bold text-gray-200 mb-2">My Assets</h3>
        <div class="grid grid-cols-3 gap-3">
          <div class="asset-wallet p-3 rounded-2xl flex items-center justify-center gap-2 cursor-pointer shadow-md">
            <i class="fa-solid fa-wallet text-purple-200"></i>
            <span class="text-xs font-bold">Wallet</span>
          </div>
          <div class="asset-store p-3 rounded-2xl flex items-center justify-center gap-2 cursor-pointer shadow-md">
            <i class="fa-solid fa-store text-pink-200"></i>
            <span class="text-xs font-bold">Store</span>
          </div>
          <div class="asset-bag p-3 rounded-2xl flex items-center justify-center gap-2 cursor-pointer shadow-md">
            <i class="fa-solid fa-bag-shopping text-emerald-200"></i>
            <span class="text-xs font-bold">Bag</span>
          </div>
        </div>
      </div>

      <!-- Full Menu Item List -->
      <div class="flex flex-col pt-2">
        
        <div class="menu-item py-3.5 flex justify-between items-center cursor-pointer">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-xl bg-purple-600/30 border border-purple-500/40 flex items-center justify-center text-purple-300 shadow">
              <i class="fa-solid fa-award"></i>
            </div>
            <span class="text-sm font-semibold">Medal</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
        </div>

        <div class="menu-item py-3.5 flex justify-between items-center cursor-pointer">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-xl bg-pink-600/30 border border-pink-500/40 flex items-center justify-center text-pink-300 shadow">
              <i class="fa-solid fa-house-user"></i>
            </div>
            <span class="text-sm font-semibold">Family</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
        </div>

        <div class="menu-item py-3.5 flex justify-between items-center cursor-pointer">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-300 shadow">
              <i class="fa-solid fa-heart"></i>
            </div>
            <span class="text-sm font-semibold">CP</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
        </div>

        <div class="menu-item py-3.5 flex justify-between items-center cursor-pointer">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-xl bg-blue-600/30 border border-blue-500/40 flex items-center justify-center text-blue-300 shadow">
              <i class="fa-solid fa-chart-line"></i>
            </div>
            <span class="text-sm font-semibold">Level</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
        </div>

        <div class="menu-item py-3.5 flex justify-between items-center cursor-pointer">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-xl bg-teal-600/30 border border-teal-500/40 flex items-center justify-center text-teal-300 shadow">
              <i class="fa-solid fa-headset"></i>
            </div>
            <span class="text-sm font-semibold">Contact us</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
        </div>

        <div class="menu-item py-3.5 flex justify-between items-center cursor-pointer">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-xl bg-fuchsia-600/30 border border-fuchsia-500/40 flex items-center justify-center text-fuchsia-300 shadow">
              <i class="fa-solid fa-people-roof"></i>
            </div>
            <span class="text-sm font-semibold">Brother and Sister</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
        </div>

        <div class="menu-item py-3.5 flex justify-between items-center cursor-pointer">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-xl bg-amber-600/30 border border-amber-500/40 flex items-center justify-center text-amber-300 shadow">
              <i class="fa-solid fa-chess-king"></i>
            </div>
            <span class="text-sm font-semibold">Host Center</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
        </div>

        <div class="menu-item py-3.5 flex justify-between items-center cursor-pointer">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-xl bg-gray-700/50 border border-gray-600/40 flex items-center justify-center text-gray-300 shadow">
              <i class="fa-solid fa-gear"></i>
            </div>
            <span class="text-sm font-semibold">Setting</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
        </div>

      </div>

    </div>

    <!-- Floating Curved Bottom Navigation Bar -->
    <div class="px-3 pb-3 absolute bottom-0 left-0 right-0 z-50">
      <div class="curved-nav py-2.5 px-4 grid grid-cols-4 text-center">
        
        <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-purple-300">
          <i class="fa-solid fa-house text-lg"></i>
          <span class="text-[10px] font-semibold mt-0.5">Home</span>
        </div>

        <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-purple-300">
          <i class="fa-solid fa-camera text-lg"></i>
          <span class="text-[10px] font-semibold mt-0.5">Moment</span>
        </div>

        <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-purple-300 relative">
          <i class="fa-solid fa-comment-dots text-lg"></i>
          <span class="absolute top-0 right-5 w-2 h-2 bg-pink-500 rounded-full"></span>
          <span class="text-[10px] font-semibold mt-0.5">Message</span>
        </div>

        <div class="flex flex-col items-center cursor-pointer text-purple-400 font-bold">
          <i class="fa-solid fa-circle-user text-xl text-purple-400"></i>
          <span class="text-[10px] mt-0.5">ME</span>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
