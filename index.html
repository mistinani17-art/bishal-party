<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bishal App - Profile</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0d0614;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="pb-24 pt-4 px-4 max-w-md mx-auto">

  <!-- User Profile Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <!-- প্রোফাইল পিকচারে টাচ করলে এডিট প্রোফাইলে যাবে -->
      <img id="avatar" 
           src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250" 
           class="w-14 h-14 rounded-full object-cover border-2 border-purple-500 shadow-md cursor-pointer active:scale-95 transition"
           onclick="openPage('edit_profile.html')">
      <div>
        <h2 class="text-base font-bold flex items-center gap-1">দাদা ভাই™</h2>
        <div class="flex items-center gap-1.5 text-xs text-purple-200 mt-0.5">
          <i class="fa-solid fa-address-card text-[11px]"></i>
          <span>101223</span>
          <i class="fa-regular fa-copy text-[10px] cursor-pointer ml-1" onclick="copyID('101223')"></i>
        </div>
      </div>
    </div>
    <!-- ডান পাশের পেনসিল আইকন -->
    <button class="text-lg text-purple-300 p-2 active:scale-95 transition" onclick="openPage('edit_profile.html')">
      <i class="fa-regular fa-pen-to-square"></i>
    </button>
  </div>

  <!-- Stats Section -->
  <div class="flex justify-around text-center mb-6 py-2 bg-purple-950/20 rounded-xl">
    <div>
      <div class="font-bold text-lg">3</div>
      <div class="text-xs text-gray-400">Visitors</div>
    </div>
    <div>
      <div class="font-bold text-lg">2</div>
      <div class="text-xs text-gray-400">Following</div>
    </div>
    <div>
      <div class="font-bold text-lg">2</div>
      <div class="text-xs text-gray-400">Followers</div>
    </div>
  </div>

  <!-- VIP & SVIP Banners -->
  <div class="grid grid-cols-2 gap-3 mb-6">
    <div onclick="openPage('vip.html')" class="cursor-pointer bg-gradient-to-r from-purple-900 to-indigo-900 p-4 rounded-2xl flex justify-between items-center border border-purple-500/30 active:scale-95 transition">
      <span class="font-extrabold text-xl text-purple-200">VIP</span>
      <div class="w-8 h-8 rounded-full bg-purple-600/50 flex items-center justify-center">
        <i class="fa-solid fa-crown text-amber-400"></i>
      </div>
    </div>
    
    <div onclick="openPage('svip.html')" class="cursor-pointer bg-gradient-to-r from-amber-700 to-amber-900 p-4 rounded-2xl flex justify-between items-center border border-amber-500/30 active:scale-95 transition">
      <span class="font-extrabold text-xl text-amber-300">SVIP</span>
      <div class="w-8 h-8 rounded-full bg-amber-600/50 flex items-center justify-center">
        <i class="fa-solid fa-crown text-amber-300"></i>
      </div>
    </div>
  </div>

  <!-- My Assets Section -->
  <div class="mb-6">
    <h3 class="text-xs font-semibold text-gray-400 mb-3">My Assets</h3>
    <div class="grid grid-cols-3 gap-3">
      <button onclick="openPage('wallet.html')" class="bg-purple-700/60 p-3 rounded-xl flex items-center justify-center gap-2 text-sm font-medium active:scale-95 transition">
        <i class="fa-solid fa-wallet"></i> Wallet
      </button>
      <button onclick="openPage('store.html')" class="bg-purple-800/60 p-3 rounded-xl flex items-center justify-center gap-2 text-sm font-medium active:scale-95 transition">
        <i class="fa-solid fa-store"></i> Store
      </button>
      <button onclick="openPage('bag.html')" class="bg-teal-700/60 p-3 rounded-xl flex items-center justify-center gap-2 text-sm font-medium active:scale-95 transition">
        <i class="fa-solid fa-bag-shopping"></i> Bag
      </button>
    </div>
  </div>

  <!-- Menu List -->
  <div class="space-y-2 text-sm">
    <div onclick="openPage('medal.html')" class="flex items-center justify-between p-3.5 bg-purple-950/20 rounded-xl cursor-pointer hover:bg-purple-900/30 active:scale-98 transition">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-purple-900/60 flex items-center justify-center text-purple-300">
          <i class="fa-solid fa-award"></i>
        </div>
        <span>Medal</span>
      </div>
      <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
    </div>

    <div onclick="openPage('family.html')" class="flex items-center justify-between p-3.5 bg-purple-950/20 rounded-xl cursor-pointer hover:bg-purple-900/30 active:scale-98 transition">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-pink-950/60 flex items-center justify-center text-pink-400">
          <i class="fa-solid fa-house font-bold"></i>
        </div>
        <span>Family</span>
      </div>
      <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
    </div>

    <div onclick="openPage('cp.html')" class="flex items-center justify-between p-3.5 bg-purple-950/20 rounded-xl cursor-pointer hover:bg-purple-900/30 active:scale-98 transition">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-blue-950/60 flex items-center justify-center text-blue-400">
          <i class="fa-solid fa-heart"></i>
        </div>
        <span>CP</span>
      </div>
      <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
    </div>

    <div onclick="openPage('level.html')" class="flex items-center justify-between p-3.5 bg-purple-950/20 rounded-xl cursor-pointer hover:bg-purple-900/30 active:scale-98 transition">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-sky-950/60 flex items-center justify-center text-sky-400">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <span>Level</span>
      </div>
      <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
    </div>

    <div onclick="openPage('contact_us.html')" class="flex items-center justify-between p-3.5 bg-purple-950/20 rounded-xl cursor-pointer hover:bg-purple-900/30 active:scale-98 transition">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-teal-950/60 flex items-center justify-center text-teal-400">
          <i class="fa-solid fa-headset"></i>
        </div>
        <span>Contact us</span>
      </div>
      <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
    </div>

    <div onclick="openPage('brother_and_sister.html')" class="flex items-center justify-between p-3.5 bg-purple-950/20 rounded-xl cursor-pointer hover:bg-purple-900/30 active:scale-98 transition">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-950/60 flex items-center justify-center text-indigo-400">
          <i class="fa-solid fa-users"></i>
        </div>
        <span>Brother and Sister</span>
      </div>
      <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
    </div>

    <div onclick="openPage('host_center.html')" class="flex items-center justify-between p-3.5 bg-purple-950/20 rounded-xl cursor-pointer hover:bg-purple-900/30 active:scale-98 transition">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-amber-950/60 flex items-center justify-center text-amber-400">
          <i class="fa-solid fa-crown"></i>
        </div>
        <span>Host Center</span>
      </div>
      <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
    </div>

    <div onclick="openPage('setting.html')" class="flex items-center justify-between p-3.5 bg-purple-950/20 rounded-xl cursor-pointer hover:bg-purple-900/30 active:scale-98 transition">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-300">
          <i class="fa-solid fa-gear"></i>
        </div>
        <span>Setting</span>
      </div>
      <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-[#160d26]/90 backdrop-blur-md border-t border-purple-900/40 px-6 py-2 flex justify-between items-center max-w-md mx-auto">
    <button onclick="openPage('index.html')" class="flex flex-col items-center gap-1 text-gray-400">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px]">Home</span>
    </button>
    <button onclick="openPage('moment.html')" class="flex flex-col items-center gap-1 text-gray-400">
      <i class="fa-solid fa-camera text-lg"></i>
      <span class="text-[10px]">Moment</span>
    </button>
    <button onclick="openPage('message.html')" class="flex flex-col items-center gap-1 text-gray-400 relative">
      <i class="fa-solid fa-comment-dots text-lg"></i>
      <span class="absolute top-0 right-2 w-2 h-2 bg-pink-500 rounded-full"></span>
      <span class="text-[10px]">Message</span>
    </button>
    <button onclick="openPage('me.html')" class="flex flex-col items-center gap-1 text-purple-400 font-bold">
      <i class="fa-solid fa-user text-lg"></i>
      <span class="text-[10px]">ME</span>
    </button>
  </div>

  <!-- JavaScript for Direct Page Navigation -->
  <script>
    function openPage(pageUrl) {
      // alert বাদ দিয়ে সরাসরি নির্দিষ্ট পেজে রিরেডাইরেক্ট করবে
      window.location.href = pageUrl;
    }

    function copyID(idText) {
      navigator.clipboard.writeText(idText);
      alert("ID Copied: " + idText);
    }
  </script>
</body>
</html>
