<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bishal Party</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0612;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .purple-gradient-bg {
      background: radial-gradient(circle at top, #2d1052 0%, #0b0612 70%);
    }
    .card-bg {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-gradient {
      background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
    }
    .purple-badge {
      background: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-center p-0 sm:p-4">

  <div class="w-full max-w-md h-screen sm:h-[840px] purple-gradient-bg flex flex-col justify-between overflow-hidden sm:rounded-3xl border border-gray-800 relative shadow-2xl">

    <!-- ================= 1. LOGIN SCREEN ================= -->
    <div id="loginScreen" class="p-6 flex flex-col justify-center items-center h-full w-full">
      <!-- App Logo -->
      <div class="w-20 h-20 btn-gradient rounded-2xl flex justify-center items-center mb-4 shadow-lg shadow-purple-500/30">
        <i class="fa-solid font-bold text-3xl text-white">✨</i>
      </div>
      
      <h1 class="text-3xl font-extrabold tracking-wide mb-1">Bishal Party</h1>
      <p class="text-xs text-purple-300 tracking-wider mb-8">Voice rooms · Vibes · Community</p>

      <!-- Auth Form Card -->
      <div class="w-full card-bg p-5 rounded-3xl flex flex-col gap-4">
        <!-- Toggle Tabs -->
        <div class="bg-black/40 p-1 rounded-2xl flex">
          <button id="loginTabBtn" onclick="switchAuthTab('login')" class="w-1/2 py-2 rounded-xl text-sm font-semibold bg-purple-600 text-white transition">Login</button>
          <button id="signupTabBtn" onclick="switchAuthTab('signup')" class="w-1/2 py-2 rounded-xl text-sm font-semibold text-gray-400 hover:text-white transition">Sign Up</button>
        </div>

        <!-- Inputs -->
        <div class="flex flex-col gap-3 mt-2">
          <input id="emailInput" type="email" value="demo@bishal.party" class="w-full bg-black/40 border border-purple-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 text-white placeholder-gray-500" placeholder="Email address">
          <input id="passInput" type="password" value="Demo1234" class="w-full bg-black/40 border border-purple-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 text-white placeholder-gray-500" placeholder="Password">
        </div>

        <!-- Submit Button -->
        <button onclick="handleLogin()" class="w-full btn-gradient py-3.5 rounded-2xl text-sm font-bold shadow-lg shadow-pink-500/20 active:scale-95 transition">
          Account Login
        </button>

        <div class="flex items-center my-1">
          <div class="flex-1 border-t border-gray-800"></div>
          <span class="px-3 text-xs text-gray-500 font-bold">OR</span>
          <div class="flex-1 border-t border-gray-800"></div>
        </div>

        <!-- Social Login -->
        <button onclick="handleLogin()" class="w-full bg-black/40 border border-gray-800 hover:border-gray-700 py-3 rounded-2xl text-xs font-semibold flex justify-center items-center gap-2 text-gray-200">
          <i class="fa-brands fa-google text-lg"></i> Continue with Google
        </button>

        <p class="text-[11px] text-center text-gray-400 mt-1">Demo: demo@bishal.party / Demo1234</p>
      </div>
    </div>

    <!-- ================= 2. MAIN APP DASHBOARD (PROFILE / ME TAB) ================= -->
    <div id="mainDashboard" class="hidden flex-col h-full w-full justify-between overflow-y-auto">
      
      <!-- Top Profile Header -->
      <div class="p-5 flex flex-col gap-5">
        
        <!-- Profile Info -->
        <div class="flex items-center gap-4">
          <div class="relative">
            <img id="userAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250" class="w-20 h-20 rounded-full object-cover border-2 border-pink-500 p-0.5 shadow-lg shadow-pink-500/30">
            <button onclick="changePhoto()" class="absolute bottom-0 right-0 bg-purple-600 text-white p-1.5 rounded-full text-xs shadow"><i class="fa-solid fa-camera"></i></button>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-2">
              <h2 id="profileName" class="text-xl font-bold">Bishal</h2>
              <i class="fa-regular fa-pen-to-square text-xs text-gray-400 cursor-pointer" onclick="editName()"></i>
            </div>
            <span class="text-xs text-purple-300">ID 888888</span>
            <span class="text-xs text-gray-400 mt-1">Sig_813c97</span>
          </div>
        </div>

        <!-- Stats Counters -->
        <div class="grid grid-cols-3 gap-2 text-center py-2">
          <div class="flex flex-col">
            <span class="text-lg font-extrabold text-white">1284</span>
            <span class="text-xs text-gray-400">Visitors</span>
          </div>
          <div class="flex flex-col">
            <span class="text-lg font-extrabold text-white">156</span>
            <span class="text-xs text-gray-400">Following</span>
          </div>
          <div class="flex flex-col">
            <span class="text-lg font-extrabold text-white">2903</span>
            <span class="text-xs text-gray-400">Followers</span>
          </div>
        </div>

        <!-- Badges (VIP / SVIP) -->
        <div class="grid grid-cols-2 gap-3">
          <div class="gold-gradient p-3 rounded-2xl flex items-center gap-3 text-black shadow-lg">
            <i class="fa-solid fa-star text-xl"></i>
            <div class="flex flex-col">
              <span class="font-extrabold text-xs">VIP</span>
              <span class="text-[10px] font-semibold opacity-80">Active</span>
            </div>
          </div>
          <div class="purple-badge p-3 rounded-2xl flex items-center gap-3 text-white shadow-lg">
            <i class="fa-solid fa-gem text-xl"></i>
            <div class="flex flex-col">
              <span class="font-extrabold text-xs">SVIP</span>
              <span class="text-[10px] font-semibold opacity-90">Active</span>
            </div>
          </div>
        </div>

        <!-- My Assets Section -->
        <div class="mt-2">
          <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider mb-3">My Assets</h3>
          <div class="grid grid-cols-3 gap-3">
            <div class="card-bg p-4 rounded-2xl flex flex-col items-center gap-1.5 cursor-pointer hover:border-purple-500 transition">
              <div class="w-10 h-10 bg-purple-900/50 rounded-xl flex items-center justify-center text-purple-300">
                <i class="fa-solid fa-wallet text-lg"></i>
              </div>
              <span class="text-sm font-extrabold mt-1">48000</span>
              <span class="text-[10px] text-gray-400">Wallet</span>
            </div>

            <div class="card-bg p-4 rounded-2xl flex flex-col items-center gap-1.5 cursor-pointer hover:border-purple-500 transition">
              <div class="w-10 h-10 bg-purple-900/50 rounded-xl flex items-center justify-center text-purple-300">
                <i class="fa-solid fa-store text-lg"></i>
              </div>
              <span class="text-sm font-extrabold mt-1">Shop</span>
              <span class="text-[10px] text-gray-400">Store</span>
            </div>

            <div class="card-bg p-4 rounded-2xl flex flex-col items-center gap-1.5 cursor-pointer hover:border-purple-500 transition">
              <div class="w-10 h-10 bg-purple-900/50 rounded-xl flex items-center justify-center text-purple-300">
                <i class="fa-solid fa-briefcase text-lg"></i>
              </div>
              <span class="text-sm font-extrabold mt-1">Items</span>
              <span class="text-[10px] text-gray-400">Bag</span>
            </div>
          </div>
        </div>

        <!-- Menu Links -->
        <div class="card-bg rounded-2xl flex flex-col divide-y divide-gray-800 mt-1">
          <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5 transition">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-medal text-purple-400"></i>
              <span class="text-sm font-semibold">Medal</span>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
          </div>

          <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5 transition">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-users text-purple-400"></i>
              <span class="text-sm font-semibold">Family</span>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
          </div>

          <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5 transition">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-heart text-purple-400"></i>
              <span class="text-sm font-semibold">CP</span>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
          </div>
        </div>

      </div>

      <!-- Bottom Navigation Bar -->
      <div class="card-bg border-t border-gray-800 p-3 grid grid-cols-3 text-center sticky bottom-0 bg-[#0b0612]/90 backdrop-blur-md">
        <div class="flex flex-col items-center text-gray-400 hover:text-purple-400 cursor-pointer">
          <i class="fa-solid fa-house text-lg"></i>
          <span class="text-[11px] mt-1 font-medium">Rooms</span>
        </div>
        <div class="flex flex-col items-center text-gray-400 hover:text-purple-400 cursor-pointer">
          <i class="fa-solid fa-bag-shopping text-lg"></i>
          <span class="text-[11px] mt-1 font-medium">Store</span>
        </div>
        <div class="flex flex-col items-center text-purple-400 font-bold cursor-pointer">
          <i class="fa-solid fa-user text-lg"></i>
          <span class="text-[11px] mt-1">Me</span>
        </div>
      </div>

    </div>

  </div>

  <script>
    function switchAuthTab(type) {
      const loginBtn = document.getElementById('loginTabBtn');
      const signupBtn = document.getElementById('signupTabBtn');
      
      if(type === 'login') {
        loginBtn.className = "w-1/2 py-2 rounded-xl text-sm font-semibold bg-purple-600 text-white transition";
        signupBtn.className = "w-1/2 py-2 rounded-xl text-sm font-semibold text-gray-400 hover:text-white transition";
      } else {
        signupBtn.className = "w-1/2 py-2 rounded-xl text-sm font-semibold bg-purple-600 text-white transition";
        loginBtn.className = "w-1/2 py-2 rounded-xl text-sm font-semibold text-gray-400 hover:text-white transition";
      }
    }

    function handleLogin() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('mainDashboard').classList.add('flex');
    }

    function editName() {
      const newName = prompt("Enter new Profile Name:", "Bishal");
      if(newName) {
        document.getElementById('profileName').innerText = newName;
      }
    }

    function changePhoto() {
      const url = prompt("Enter Image URL:");
      if(url) {
        document.getElementById('userAvatar').src = url;
      }
    }
  </script>
</body>
</html>
